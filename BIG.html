<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BTC 完美居中悬浮窗</title>
<style>
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body{text-align:center;padding:40px 16px}
.container{max-width:420px;margin:auto}
h2{margin-bottom:10px;font-size:22px}
button{padding:16px 24px;font-size:17px;font-weight:700;border:0;background:#007aff;color:#fff;border-radius:12px;margin-top:10px;cursor:pointer;}
button:active{transform:scale(0.95);opacity:0.8;}
#status{margin:18px 0 0;color:#8e8e93;font-size:13px;line-height:1.5}
video{display:block;width:320px;height:160px;margin:25px auto 0;background:#000;border:1px solid #222;border-radius:12px}
canvas{display:none}
</style>
</head>
<body>
<div class="container">
<h2>BTC 完美居中盯盘</h2>
<p id="status">正在建立连接…</p>
<button id="pipBtn">⚡ 开启悬浮窗</button>
<canvas id="canvas" width="640" height="320"></canvas>
<video id="video" width="320" height="160" autoplay playsinline></video>
</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const video=document.getElementById("video");
const btn=document.getElementById("pipBtn");
const status=document.getElementById("status");

let btcPrice="加载中...";
let displayPriceStr="..."; 
let priceColor="#007aff";
let lastPrice=0;
let btcChangeRate="--%"; 
let changeColor="#8e8e93";

let ws=null;
let pingTimer=null;
let reconnectTimer=null;

let isDrawing = false;
function scheduleDraw() {
  if (!isDrawing) {
    isDrawing = true;
    requestAnimationFrame(() => {
      drawCanvas();
      isDrawing = false;
    });
  }
}

function formatPrice(num) {
  return parseFloat(num).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

function drawCanvas(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="#1c1c1e";
  ctx.lineWidth=6;
  ctx.strokeRect(3,3,canvas.width-6,canvas.height-6);

  // 【完美居中优化】画布高度 320，中心点 160。向下微调 15px 到 175，视觉上绝对处于整体正中央
  ctx.fillStyle=priceColor;
  ctx.font="bold 130px -apple-system, Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("₮" + displayPriceStr, canvas.width / 2, 175);
  
  // 涨跌幅定位在右下角
  ctx.fillStyle=changeColor;
  ctx.font="bold 42px -apple-system, Arial";
  ctx.textAlign="right";
  ctx.textBaseline="alphabetic";
  ctx.fillText(btcChangeRate, canvas.width - 35, canvas.height - 30);
}

function startStream(){
  if(!canvas.captureStream) return false;
  try{
    video.srcObject=canvas.captureStream(60); 
    video.muted = true;
    return true;
  }catch(e){
    return false;
  }
}

function stopPing(){
  if(pingTimer){clearInterval(pingTimer);pingTimer=null;}
}

function updateInstantPrice(p) {
  if(!Number.isFinite(p)) return;
  if(lastPrice && p === lastPrice) return; 

  if(lastPrice && p !== lastPrice){
    priceColor = p > lastPrice ? "#34c759" : "#ff3b30";
  }
  btcPrice = p;
  displayPriceStr = formatPrice(p);
  lastPrice = p;
  
  scheduleDraw();
}

function connectMEXC(forceKill = false){
  if(ws) {
    if(!forceKill && (ws.readyState===WebSocket.OPEN || ws.readyState===WebSocket.CONNECTING)) return;
    ws.close();
    ws = null;
  }

  status.textContent="正在接入高速节点…";
  ws=new WebSocket("wss://contract.mexc.com/edge");

  ws.onopen=()=>{
    status.textContent="已连接，极速现价同步中…";
    ws.send(JSON.stringify({ method:"sub.ticker", param:{symbol:"BTC_USDT"} }));
    ws.send(JSON.stringify({ method:"sub.deal", param:{symbol:"BTC_USDT"} }));

    stopPing();
    pingTimer=setInterval(()=>{
      if(ws && ws.readyState===WebSocket.OPEN){
        ws.send(JSON.stringify({method:"ping"}));
      }
    },15000);
  };

  ws.onmessage=(event)=>{
    try{
      const res=JSON.parse(event.data);
      
      if(res.channel==="push.ticker" && res.symbol==="BTC_USDT" && res.data){
        if(res.data.riseFallRate !== undefined) {
          const rate = parseFloat(res.data.riseFallRate);
          if (Number.isFinite(rate)) {
            const percentStr = (rate * 100).toFixed(2) + "%";
            if (rate > 0) { btcChangeRate = "+" + percentStr; changeColor = "#34c759"; } 
            else if (rate < 0) { btcChangeRate = percentStr; changeColor = "#ff3b30"; } 
            else { btcChangeRate = "0.00%"; changeColor = "#8e8e93"; }
          }
        }
        if(res.data.lastPrice) updateInstantPrice(parseFloat(res.data.lastPrice));
      }

      if(res.channel==="push.deal" && res.symbol==="BTC_USDT" && res.data){
        let p = null;
        if(Array.isArray(res.data) && res.data.length > 0) {
          p = parseFloat(res.data[0].p); 
        } else if (res.data.p) {
          p = parseFloat(res.data.p);
        }
        if(p !== null) {
          updateInstantPrice(p);
          status.textContent="🟢 零延迟极速刷新 (60FPS)";
        }
      }
    }catch(e){}
  };

  ws.onerror=()=>{
    status.textContent="连接异常，准备极速重连…";
  };

  ws.onclose=()=>{
    stopPing();
    status.textContent="连接断开，正在极速重连…";
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(connectMEXC, 500);
  };
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (video.paused) video.play().catch(()=>{});
    if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
      status.textContent = "屏幕唤醒，极速重连中...";
      connectMEXC(true);
    }
    scheduleDraw();
  }
});

window.addEventListener("focus", () => {
  if (video.paused) video.play().catch(()=>{});
});

scheduleDraw();

const streamOK=startStream();
if(!streamOK){
  btn.disabled=true;
}else{
  connectMEXC();
}

btn.addEventListener("click", () => {
  try {
    if (!window.audioHackApplied) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      
      const destination = audioCtx.createMediaStreamDestination();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      gainNode.gain.value = 0; 
      
      oscillator.connect(gainNode);
      gainNode.connect(destination);
      oscillator.start();

      const audioTrack = destination.stream.getAudioTracks()[0];
      if (audioTrack && video.srcObject) {
        video.srcObject.addTrack(audioTrack);
      }
      
      video.muted = false; 
      audioCtx.resume();
      window.audioHackApplied = true;
    }

    if (video.requestPictureInPicture) {
      video.requestPictureInPicture().catch(error => {
         alert("开启悬浮窗失败：" + error.message);
      });
    } else if (video.webkitSetPresentationMode) {
      video.webkitSetPresentationMode("picture-in-picture");
    }
  } catch (error) {
    alert("执行出错：" + error.message);
  }
});
</script>
</body>
</html>
