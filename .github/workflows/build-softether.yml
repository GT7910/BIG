name: Build SoftEther ARM64 musl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Test ARM64
        run: |
          docker run --rm --platform linux/arm64 alpine:3.19 uname -m

      - name: Build SoftEther
        run: |
          mkdir -p output

          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD/output:/output" \
            alpine:3.19 \
            sh -euxc '
              apk add --no-cache \
                build-base \
                binutils \
                linux-headers \
                readline-dev \
                openssl-dev \
                ncurses-dev \
                git \
                cmake \
                zlib-dev \
                libsodium-dev \
                gnu-libiconv \
                file

              export LD_PRELOAD=/usr/lib/preloadable_libiconv.so
              export USE_MUSL=YES

              cd /tmp
              git clone --depth 1 https://github.com/SoftEtherVPN/SoftEtherVPN.git
              cd SoftEtherVPN

              git submodule init
              git submodule update

              ./configure
              make -C build -j2

              file build/vpnserver
              file build/vpncmd

              mkdir -p /output
              cp build/vpnserver /output/
              cp build/vpncmd /output/
              cp build/hamcore.se2 /output/

              chmod 755 /output/vpnserver
              chmod 755 /output/vpncmd
            '

      - name: Upload SoftEther
        uses: actions/upload-artifact@v4
        with:
          name: softether-arm64-musl
          path: output/
