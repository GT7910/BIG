- name: Build SoftEther
  run: |
    mkdir -p output

    docker run --rm \
      --platform linux/arm64 \
      -v "$PWD/output:/output" \
      alpine:3.19 \
      sh -euxc '
        apk add --no-cache \
          build-base \
          binutils \
          linux-headers \
          readline-dev \
          openssl-dev \
          ncurses-dev \
          git \
          cmake \
          zlib-dev \
          libsodium-dev \
          gnu-libiconv \
          file

        export LD_PRELOAD=/usr/lib/preloadable_libiconv.so
        export USE_MUSL=YES

        cd /tmp

        git clone --depth 1 \
          https://github.com/SoftEtherVPN/SoftEtherVPN.git

        cd SoftEtherVPN

        git submodule init
        git submodule update

        ./configure

        make -C build -j2

        echo
        echo "===== VPN SERVER ====="
        file build/vpnserver
        ldd build/vpnserver || true

        echo
        echo "===== VPN CMD ====="
        file build/vpncmd
        ldd build/vpncmd || true

        mkdir -p /output

        cp build/vpnserver /output/
        cp build/vpncmd /output/
        cp build/hamcore.se2 /output/

        chmod 755 /output/vpnserver
        chmod 755 /output/vpncmd
      '
