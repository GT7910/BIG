<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BTC 极限边缘空间版</title>
<style>
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body{text-align:center;padding:40px 16px}
.container{max-width:420px;margin:auto}
h2{margin-bottom:10px;font-size:22px}
.btn-group {display: flex; justify-content: center; gap: 12px; margin-top: 15px;}
button{padding:16px 20px;font-size:16px;font-weight:700;border:0;background:#007aff;color:#fff;border-radius:12px;cursor:pointer;}
button.bg-dark {background: #2c2c2e;}
button:active{transform:scale(0.95);opacity:0.8;}
#status{margin:18px 0 0;color:#8e8e93;font-size:13px;line-height:1.5}
/* 删除了容易引起误会的 CSS 外边框，现在所见即所得 */
video{display:block;width:320px;height:160px;margin:25px auto 0;background:#000;border-radius:18px;}
canvas{display:none}
</style>
</head>
<body>
<div class="container">
<h2>BTC 极简盯盘终端</h2>
<p id="status">正在建立连接…</p>
<div class="btn-group">
  <button id="pipBtn">⚡ 开启无声悬浮</button>
  <button id="fsBtn" class="bg-dark">🖥️ 全屏大字</button>
</div>
<canvas id="canvas" width="640" height="320"></canvas>
<video id="video" width="320" height="160" autoplay playsinline muted></video>
</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const video=document.getElementById("video");
const btn=document.getElementById("pipBtn");
const fsBtn=document.getElementById("fsBtn");
const status=document.getElementById("status");

let btcPrice="加载中...";
let displayPriceStr="..."; 
let priceColor="#007aff";
let lastPrice=0;
let btcChangeRate="--%"; 
let changeColor="#8e8e93";

let ws=null;
let pingTimer=null;
let reconnectTimer=null;

let isDrawing = false;
function scheduleDraw() {
  if (document.hidden || document.visibilityState === "hidden") {
    drawCanvas();
    return;
  }
  
  if (!isDrawing) {
    isDrawing = true;
    requestAnimationFrame(() => {
      drawCanvas();
      isDrawing = false;
    });
  }
}

function formatPrice(num) {
  return parseFloat(num).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

function drawCanvas(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // 【暴力重构】：放弃画圆角，直接在绝对物理边缘 (0,0) 画一个超粗的直角边框！
  // 巧妙利用苹果 iOS 悬浮窗自带的“物理圆角遮罩”，系统会自动帮我们把四个直角切成完美的圆角！
  // 这样既保证了边框最靠外，又给巨型字体留出了 100% 的呼吸空间。
  ctx.strokeStyle = priceColor; 
  ctx.lineWidth = 20; // 极粗边缘，一半在画内(10px)，一半在画外
  ctx.strokeRect(0, 0, canvas.width, canvas.height);

  // 价格 (取消了一切断流遮罩，硬核直出，130px绝对不缩水)
  ctx.fillStyle=priceColor;
  ctx.font="bold 130px -apple-system, Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("₮" + displayPriceStr, canvas.width / 2, 175);
  
  // 涨跌幅
  ctx.fillStyle=changeColor;
  ctx.font="bold 42px -apple-system, Arial";
  ctx.textAlign="right";
  ctx.textBaseline="alphabetic";
  ctx.fillText(btcChangeRate, canvas.width - 25, canvas.height - 25);
}

function startStream(){
  if(!canvas.captureStream) return false;
  try{
    video.srcObject=canvas.captureStream(60); 
    return true;
  }catch(e){
    return false;
  }
}

function stopPing(){
  if(pingTimer){clearInterval(pingTimer);pingTimer=null;}
}

function updateInstantPrice(p) {
  if(!Number.isFinite(p)) return;
  if(lastPrice && p === lastPrice) return; 

  if(lastPrice && p !== lastPrice){
    priceColor = p > lastPrice ? "#34c759" : "#ff3b30";
  }
  btcPrice = p;
  displayPriceStr = formatPrice(p);
  lastPrice = p;
  
  scheduleDraw();
}

function connectMEXC(forceKill = false){
  if(ws) {
    if(!forceKill && (ws.readyState===WebSocket.OPEN || ws.readyState===WebSocket.CONNECTING)) return;
    ws.close();
    ws = null;
  }

  status.textContent="正在接入高速节点…";
  ws=new WebSocket("wss://contract.mexc.com/edge");

  ws.onopen=()=>{
    status.textContent="已连接，纯净视觉流同步中…";
    ws.send(JSON.stringify({ method:"sub.ticker", param:{symbol:"BTC_USDT"} }));
    ws.send(JSON.stringify({ method:"sub.deal", param:{symbol:"BTC_USDT"} }));

    stopPing();
    pingTimer=setInterval(()=>{
      if(ws && ws.readyState===WebSocket.OPEN){
        ws.send(JSON.stringify({method:"ping"}));
      }
    },15000);
  };

  ws.onmessage=(event)=>{
    try{
      const res=JSON.parse(event.data);
      
      if(res.channel==="push.ticker" && res.symbol==="BTC_USDT" && res.data){
        if(res.data.riseFallRate !== undefined) {
          const rate = parseFloat(res.data.riseFallRate);
          if (Number.isFinite(rate)) {
            const percentStr = (rate * 100).toFixed(2) + "%";
            if (rate > 0) { btcChangeRate = "+" + percentStr; changeColor = "#34c759"; } 
            else if (rate < 0) { btcChangeRate = percentStr; changeColor = "#ff3b30"; } 
            else { btcChangeRate = "0.00%"; changeColor = "#8e8e93"; }
          }
        }
        if(res.data.lastPrice) updateInstantPrice(parseFloat(res.data.lastPrice));
      }

      if(res.channel==="push.deal" && res.symbol==="BTC_USDT" && res.data){
        let p = null;
        if(Array.isArray(res.data) && res.data.length > 0) {
          p = parseFloat(res.data[0].p); 
        } else if (res.data.p) {
          p = parseFloat(res.data.p);
        }
        if(p !== null) {
          updateInstantPrice(p);
          status.textContent="🟢 零延迟极速刷新 (可共存看视频)";
        }
      }
    }catch(e){}
  };

  ws.onerror=()=>{
    status.textContent="连接异常，准备极速重连…";
  };

  ws.onclose=()=>{
    stopPing();
    status.textContent="连接断开，正在极速重连…";
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(connectMEXC, 500);
  };
}

document.addEventListener("visibilitychange", () => {
  if (video.paused) video.play().catch(()=>{});
  
  if (document.visibilityState === "visible") {
    if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
      status.textContent = "屏幕唤醒，极速重连中...";
      connectMEXC(true);
    }
  }
  scheduleDraw();
});

window.addEventListener("focus", () => {
  if (video.paused) video.play().catch(()=>{});
});

setInterval(() => {
  if (video.paused && document.pictureInPictureElement) {
    video.play().catch(()=>{});
  }
}, 1000);

scheduleDraw();

const streamOK=startStream();
if(!streamOK){
  btn.disabled=true;
  fsBtn.disabled=true;
}else{
  connectMEXC();
}

btn.addEventListener("click", () => {
  try {
    if (video.requestPictureInPicture) {
      video.requestPictureInPicture().catch(error => alert("开启悬浮窗失败：" + error.message));
    } else if (video.webkitSetPresentationMode) {
      video.webkitSetPresentationMode("picture-in-picture");
    }
  } catch (error) {
    alert("执行出错：" + error.message);
  }
});

fsBtn.addEventListener("click", () => {
  try {
    if (video.requestFullscreen) {
      video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen(); 
    } else {
      alert("当前设备或浏览器不支持全屏功能");
    }
  } catch (error) {
    alert("全屏失败：" + error.message);
  }
});
</script>
</body>
</html>
